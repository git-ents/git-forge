[workspace]
members = [
    "crates/gix-forge",
    "crates/git-forge",
    "crates/git-forge-ui",
    "crates/test-support",
]
exclude = [
    "vendor/acdc/acdc-parser",
    "vendor/acdc/converters/core",
    "vendor/acdc/converters/terminal",
    "vendor/topcoat/crates/topcoat",
    "vendor/topcoat/crates/topcoat-router",
    "vendor/topcoat/crates/topcoat-view",
    "vendor/topcoat/crates/topcoat-runtime",
    "vendor/topcoat/crates/topcoat-asset",
]
resolver = "3"

# Debug info from dependencies dominates local debug binaries (especially the
# embedded syntax grammars). Keep line information for this workspace while
# leaving third-party code debuggable only through its public interfaces.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

# The embedded tree-sitter parse tables are irreducible data, so the only
# release size left to win is code and metadata: cross-crate inlining and dead
# code elimination, and no symbol table in the shipped binary.
#
# `panic = "abort"` is deliberately absent. It saves little here, and the UI is
# a server: unwinding confines a panicking request handler to its own Tokio
# task, where aborting would take down every other connection with it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
gix-anchor = { git = "https://github.com/git-ents/git-anchor.git" }
gix-attest = { git = "https://github.com/git-ents/git-anchor.git" }
gix-store = { git = "https://github.com/git-ents/git-store.git" }
gix-query = { git = "https://github.com/git-ents/git-query.git" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs"] }
facet = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
thiserror = "2"
tempfile = "3"
