[workspace]
members = [
    "crates/gix-forge",
    "crates/git-forge",
    "crates/git-forge-ui",
    "crates/test-support",
]
exclude = [
    "vendor/acdc/acdc-parser",
    "vendor/acdc/converters/core",
    "vendor/acdc/converters/terminal",
    "vendor/topcoat/crates/topcoat",
    "vendor/topcoat/crates/topcoat-router",
    "vendor/topcoat/crates/topcoat-view",
    "vendor/topcoat/crates/topcoat-runtime",
    "vendor/topcoat/crates/topcoat-asset",
]
resolver = "3"

# Debug info from dependencies dominates local debug binaries (especially the
# embedded syntax grammars). Keep line information for this workspace while
# leaving third-party code debuggable only through its public interfaces.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[workspace.dependencies]
gix-anchor = { git = "https://github.com/git-ents/git-anchor.git" }
gix-store = { git = "https://github.com/git-ents/git-store.git" }
gix-query = { git = "https://github.com/git-ents/git-query.git" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs"] }
facet = "0.50.0-rc.5"
facet-value = "0.50.0-rc.5"
thiserror = "2"
tempfile = "3"
