[package]
name = "git-forge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "git-forge"
path = "src/main.rs"

[dependencies]
gix-forge = { path = "../gix-forge" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
comfy-table = "7"
owo-colors = "4"
acdc-parser = { git = "https://github.com/nlopes/acdc.git", package = "acdc-parser", default-features = false, features = ["pre-spec-subs", "setext"] }
acdc-converters-core = { git = "https://github.com/nlopes/acdc.git", package = "acdc-converters-core", default-features = false }
acdc-converters-terminal = { git = "https://github.com/nlopes/acdc.git", package = "acdc-converters-terminal", default-features = false, features = ["pre-spec-subs", "highlighting"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
test-support = { path = "../test-support" }
