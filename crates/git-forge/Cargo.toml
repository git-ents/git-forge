[package]
name = "git-forge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "git-forge"
path = "src/main.rs"

[dependencies]
gix-forge = { path = "../gix-forge" }
gix = { version = "0.85.0", default-features = false, features = ["sha1", "zlib-rs", "interrupt", "revision"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
test-support = { path = "../test-support" }
